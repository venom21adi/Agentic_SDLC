version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agentic-sdlc-postgres
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc_password
      POSTGRES_DB: agentic_sdlc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
