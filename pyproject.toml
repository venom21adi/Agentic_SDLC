[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Multi-agent SDLC orchestration system with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Aditya Shah", email = "adityarobots21@gmail.com"}]
dependencies = [
    "langgraph>=0.0.49",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.10",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.24.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
